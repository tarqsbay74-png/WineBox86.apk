name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # تم التغيير هنا لاستخدام إصدار أقدم يدعم الحزم القديمة
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git flex bison automake libtool autoconf build-essential unzip python-is-python2 python3 groff-base pkg-config libfreetype6-dev openjdk-8-jdk-headless librsvg2-bin cmake

      - name: Run Build Script
        run: |
          cd apk-builder
          ./build-apks 6.0-rc6

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apk-builder/**/*.apk
          
