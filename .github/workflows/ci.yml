name: Build Wine APK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Wine release version'
        required: false
        default: '9.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git flex bison automake libtool autoconf build-essential unzip python3 groff-base pkg-config libfreetype6-dev openjdk-17-jdk-headless librsvg2-bin cmake make

      - name: Make Script Executable & Run Build
        run: |
          cd apk-builder
          chmod +x build-apks
          # تشغيل السكربت وتمرير إصدار Wine 9.0 (أو الإصدار المحدد من القائمة)
          ./build-apks "${{ github.event.inputs.release_version }}"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wine-9.0-apks
          path: apk-builder/**/*.apk
          
